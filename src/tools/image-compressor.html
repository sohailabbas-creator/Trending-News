<div class="panel">
  <label class="drop" for="ic-files" id="ic-drop">
    <strong>Choose images</strong> or drag them here<br>
    <span class="muted small">JPG, PNG or WebP · processed locally, never uploaded</span>
  </label>
  <input type="file" id="ic-files" accept="image/*" multiple hidden>

  <div class="row">
    <div class="field">
      <label for="ic-quality">Quality: <span id="ic-q-val">0.80</span></label>
      <input type="range" id="ic-quality" min="0.3" max="0.95" step="0.05" value="0.8">
    </div>
    <div class="field">
      <label for="ic-width">Maximum width in pixels (0 = keep original)</label>
      <input type="number" id="ic-width" value="1600" min="0" max="10000" step="50" inputmode="numeric">
    </div>
  </div>
  <div class="btns">
    <button class="btn btn-primary" id="ic-run" disabled>Compress</button>
    <button class="btn" id="ic-clear" disabled>Clear</button>
  </div>
  <p class="status" id="ic-status" role="status">No images selected.</p>
</div>

<div class="panel">
  <h2 class="panel-h">Results</h2>
  <div class="table-wrap"><table class="data">
    <thead><tr><th scope="col">File</th><th scope="col">Before</th><th scope="col">After</th><th scope="col">Saving</th><th scope="col">Download</th></tr></thead>
    <tbody id="ic-body"><tr><td colspan="5" class="muted">Add images to see results.</td></tr></tbody>
  </table></div>
</div>

<script>
(function(){
  var input=document.getElementById('ic-files'),items=[],status=document.getElementById('ic-status'),
      runBtn=document.getElementById('ic-run'),clearBtn=document.getElementById('ic-clear'),body=document.getElementById('ic-body');
  function size(b){return b>1048576?(b/1048576).toFixed(2)+' MB':(b/1024).toFixed(0)+' KB';}
  document.getElementById('ic-quality').addEventListener('input',function(){
    document.getElementById('ic-q-val').textContent=parseFloat(this.value).toFixed(2);});
  input.addEventListener('change',function(e){
    items=items.concat([].slice.call(e.target.files).map(function(f){return {file:f,out:null};}));
    runBtn.disabled=items.length===0;clearBtn.disabled=items.length===0;
    status.textContent=items.length+' image(s) ready — press Compress.';status.className='status';
    input.value='';
  });
  ['dragenter','dragover'].forEach(function(ev){
    document.getElementById('ic-drop').addEventListener(ev,function(e){e.preventDefault();this.classList.add('over');});});
  ['dragleave','drop'].forEach(function(ev){
    document.getElementById('ic-drop').addEventListener(ev,function(e){e.preventDefault();this.classList.remove('over');});});
  document.getElementById('ic-drop').addEventListener('drop',function(e){
    if(!e.dataTransfer||!e.dataTransfer.files)return;
    items=items.concat([].slice.call(e.dataTransfer.files).filter(function(f){return /^image\//.test(f.type);})
      .map(function(f){return {file:f,out:null};}));
    runBtn.disabled=items.length===0;clearBtn.disabled=items.length===0;});
  clearBtn.addEventListener('click',function(){items=[];runBtn.disabled=clearBtn.disabled=true;
    body.innerHTML='<tr><td colspan="5" class="muted">Add images to see results.</td></tr>';
    status.textContent='No images selected.';status.className='status';});
  function compressOne(item){
    return new Promise(function(resolve){
      var img=new Image();
      var url=URL.createObjectURL(item.file);
      img.onload=function(){
        var maxW=parseInt(document.getElementById('ic-width').value,10)||0;
        var scale=maxW>0?Math.min(1,maxW/img.width):1;
        var canvas=document.createElement('canvas');
        canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
        var ctx=canvas.getContext('2d');
        var type=item.file.type==='image/png'?'image/png':'image/jpeg';
        if(type==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);}
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        canvas.toBlob(function(blob){
          URL.revokeObjectURL(url);
          item.out={blob:blob,w:canvas.width,h:canvas.height,url:URL.createObjectURL(blob)};
          resolve();
        },type,parseFloat(document.getElementById('ic-quality').value));
      };
      img.onerror=function(){URL.revokeObjectURL(url);item.out=false;resolve();};
      img.src=url;
    });
  }
  runBtn.addEventListener('click',async function(){
    runBtn.disabled=true;
    status.textContent='Compressing…';status.className='status show';
    var before=0,after=0,rows=[];
    for(var i=0;i<items.length;i++){
      await compressOne(items[i]);
      var it=items[i];
      if(!it.out){rows.push('<tr><td>'+it.file.name+'</td><td colspan="4" class="bad">Could not read this file</td></tr>');continue;}
      before+=it.file.size;after+=it.out.blob.size;
      var saving=Math.max(0,(1-it.out.blob.size/it.file.size)*100);
      rows.push('<tr><td>'+it.file.name+'<div class="muted small">'+it.out.w+' × '+it.out.h+'</div></td>'+
        '<td class="mono">'+size(it.file.size)+'</td><td class="mono">'+size(it.out.blob.size)+'</td>'+
        '<td class="mono '+(saving>0?'ok':'bad')+'">'+saving.toFixed(0)+'%</td>'+
        '<td><a class="btn btn-sm" download="compressed-'+it.file.name+'" href="'+it.out.url+'">Download</a></td></tr>');
    }
    body.innerHTML=rows.join('');
    var total=before?((1-after/before)*100):0;
    status.textContent='Done — '+size(before)+' → '+size(after)+' ('+total.toFixed(0)+'% smaller overall).';
    status.className='status ok show';
    runBtn.disabled=false;
  });
})();
</script>
