<div class="panel">
  <label for="jf-input">JSON input</label>
  <textarea id="jf-input" rows="9" class="mono" placeholder='{"site":"sohailabbas.site","tools":20}'></textarea>
  <div class="row" style="margin-top:12px">
    <div class="field"><label for="jf-indent">Indent</label>
      <select id="jf-indent"><option value="2">2 spaces</option><option value="4">4 spaces</option><option value="1">Tab</option></select>
    </div>
    <div class="field" style="display:flex;align-items:flex-end">
      <div class="btns" style="margin:0">
        <button class="btn btn-primary" id="jf-format">Format</button>
        <button class="btn" id="jf-minify">Minify</button>
        <button class="btn" id="jf-sample">Sample</button>
        <button class="btn" id="jf-clear">Clear</button>
      </div>
    </div>
  </div>
  <p class="status" id="jf-status" role="status"></p>
</div>

<div class="panel">
  <h2 class="panel-h">Output</h2>
  <div class="stat-grid">
    <div class="stat"><b id="jf-in">0</b><span>Input bytes</span></div>
    <div class="stat"><b id="jf-out-b">0</b><span>Output bytes</span></div>
    <div class="stat"><b id="jf-keys">0</b><span>Keys</span></div>
    <div class="stat"><b id="jf-depth">0</b><span>Max depth</span></div>
  </div>
  <div class="out mono" id="jf-out" style="max-height:380px" aria-live="polite"></div>
  <div class="btns"><button class="btn" id="jf-copy">Copy output</button></div>
</div>

<script>
(function(){
  var input=document.getElementById('jf-input'),out=document.getElementById('jf-out'),status=document.getElementById('jf-status');
  var SAMPLE=JSON.stringify({site:'sohailabbas.site',tools:20,free:true,stack:['html','css','javascript'],
    categories:['money-tax','dates-time','files'],stats:{tools:20,categories:5}},null,2);
  function keys(o,acc){
    if(Array.isArray(o))o.forEach(function(x){keys(x,acc);});
    else if(o&&typeof o==='object')Object.keys(o).forEach(function(k){acc.n++;keys(o[k],acc);});
    return acc.n;
  }
  function depth(o){
    if(Array.isArray(o))return 1+o.reduce(function(a,x){return Math.max(a,depth(x));},0);
    if(o&&typeof o==='object'){var ks=Object.keys(o);
      return 1+(ks.length?ks.reduce(function(a,k){return Math.max(a,depth(o[k]));},0):0);}
    return 1;
  }
  function process(minify){
    var raw=input.value.trim();
    document.getElementById('jf-in').textContent=input.value.length.toLocaleString();
    if(!raw){status.textContent='Nothing to convert — paste some JSON first.';status.className='status bad show';return;}
    try{
      var obj=JSON.parse(raw);
      var ind=document.getElementById('jf-indent').value;
      var res=minify?JSON.stringify(obj):JSON.stringify(obj,null,ind==='1'?'\t':parseInt(ind,10));
      out.textContent=res;
      document.getElementById('jf-out-b').textContent=res.length.toLocaleString();
      document.getElementById('jf-keys').textContent=keys(obj,{n:0});
      document.getElementById('jf-depth').textContent=depth(obj);
      status.textContent='Valid JSON · '+(minify?'minified':'formatted')+' · '+(res.length-raw.length>=0?'+':'')+(res.length-raw.length).toLocaleString()+' bytes';
      status.className='status ok show';
    }catch(err){
      out.textContent='';
      var m=/position (\d+)/.exec(err.message),where='';
      if(m){var idx=parseInt(m[1],10);
        where=' (line '+(raw.slice(0,idx).split('\n').length)+', character '+((idx%raw.slice(0,idx).split('\n').pop().length)+1)+')';}
      status.textContent='Invalid JSON: '+err.message.replace('JSON.parse: ','')+where;
      status.className='status bad show';
    }
  }
  document.getElementById('jf-format').addEventListener('click',function(){process(false);});
  document.getElementById('jf-minify').addEventListener('click',function(){process(true);});
  document.getElementById('jf-sample').addEventListener('click',function(){input.value=SAMPLE;process(false);});
  document.getElementById('jf-clear').addEventListener('click',function(){
    input.value='';out.textContent='';status.className='status';
    ['jf-in','jf-out-b','jf-keys','jf-depth'].forEach(function(id){document.getElementById(id).textContent='0';});});
  document.getElementById('jf-copy').addEventListener('click',function(){
    if(!out.textContent)return;
    navigator.clipboard.writeText(out.textContent).then(function(){
      status.textContent='Output copied.';status.className='status ok show';});});
  input.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter')process(false);});
  document.getElementById('jf-sample').click();
})();
</script>
