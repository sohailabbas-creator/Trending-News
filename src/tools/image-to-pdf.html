<div class="panel">
  <label class="drop" for="ip-files" id="ip-drop">
    <strong>Choose images</strong> or drag them here<br>
    <span class="muted small">JPG and PNG · each image becomes one page</span>
  </label>
  <input type="file" id="ip-files" accept="image/jpeg,image/png" multiple hidden>

  <ul class="filelist" id="ip-list"></ul>

  <div class="row">
    <div class="field"><label for="ip-size">Page size</label>
      <select id="ip-size"><option value="a4" selected>A4 (210 × 297 mm)</option><option value="letter">Letter (8.5 × 11 in)</option></select></div>
    <div class="field"><label for="ip-orient">Orientation</label>
      <select id="ip-orient"><option value="auto" selected>Match each image</option><option value="p">Portrait</option><option value="l">Landscape</option></select></div>
  </div>
  <div class="row">
    <div class="field"><label for="ip-mode">Fitting</label>
      <select id="ip-mode"><option value="fit" selected>Fit — show the whole image</option><option value="fill">Fill — cover the page (crops edges)</option></select></div>
    <div class="field"><label for="ip-margin">Margin (points, 0–60)</label><input type="number" id="ip-margin" value="24" min="0" max="60" step="1" inputmode="numeric"></div>
  </div>

  <div class="btns">
    <button class="btn btn-primary" id="ip-run" disabled>Create PDF</button>
    <button class="btn" id="ip-clear" disabled>Clear</button>
  </div>
  <p class="status" id="ip-status" role="status">No images selected.</p>
  <div id="ip-download"></div>
</div>

<script src="{{P}}assets/vendor/pdf-lib.min.js"></script>
<script>
(function(){
  var input=document.getElementById('ip-files'),files=[],status=document.getElementById('ip-status'),
      list=document.getElementById('ip-list'),runBtn=document.getElementById('ip-run'),clearBtn=document.getElementById('ip-clear'),
      dl=document.getElementById('ip-download');
  function size(b){return b>1048576?(b/1048576).toFixed(1)+' MB':(b/1024).toFixed(0)+' KB';}
  function render(){
    list.innerHTML=files.map(function(f,i){
      return '<li><span class="fl-name">'+(i+1)+'. '+f.name+'</span><span class="muted small">'+size(f.size)+'</span>'+
        '<span class="fl-actions"><button class="link-btn" data-up="'+i+'" aria-label="Move up">↑</button>'+
        '<button class="link-btn" data-down="'+i+'" aria-label="Move down">↓</button>'+
        '<button class="link-btn" data-del="'+i+'" aria-label="Remove">×</button></span></li>';}).join('');
    runBtn.disabled=files.length===0;clearBtn.disabled=files.length===0;
    if(files.length)status.textContent=files.length+' image(s) → '+files.length+' page(s).';
    status.className='status';
  }
  function add(list2){
    var added=[].slice.call(list2).filter(function(f){return /^image\/(jpeg|png)$/.test(f.type);});
    files=files.concat(added);render();
  }
  input.addEventListener('change',function(e){add(e.target.files);input.value='';});
  ['dragenter','dragover'].forEach(function(ev){
    document.getElementById('ip-drop').addEventListener(ev,function(e){e.preventDefault();this.classList.add('over');});});
  ['dragleave','drop'].forEach(function(ev){
    document.getElementById('ip-drop').addEventListener(ev,function(e){e.preventDefault();this.classList.remove('over');});});
  document.getElementById('ip-drop').addEventListener('drop',function(e){if(e.dataTransfer)add(e.dataTransfer.files);});
  list.addEventListener('click',function(e){
    var t=e.target;
    if(t.dataset.up!==undefined){var i=+t.dataset.up;if(i>0){files.splice(i-1,0,files.splice(i,1)[0]);render();}}
    if(t.dataset.down!==undefined){var j=+t.dataset.down;if(j<files.length-1){files.splice(j+1,0,files.splice(j,1)[0]);render();}}
    if(t.dataset.del!==undefined){files.splice(+t.dataset.del,1);render();}
  });
  clearBtn.addEventListener('click',function(){files=[];dl.innerHTML='';render();});
  runBtn.addEventListener('click',async function(){
    if(!files.length)return;
    runBtn.disabled=true;status.textContent='Building the PDF in your browser…';status.className='status show';
    try{
      var pdf=await PDFLib.PDFDocument.create();
      var A4=[595.28,841.89],LETTER=[612,792];
      var base=document.getElementById('ip-size').value==='letter'?LETTER:A4;
      var orient=document.getElementById('ip-orient').value;
      var mode=document.getElementById('ip-mode').value;
      var margin=Math.max(0,Math.min(60,parseFloat(document.getElementById('ip-margin').value)||0));
      for(var i=0;i<files.length;i++){
        var f=files[i],bytes=await f.arrayBuffer(),img;
        if(/png$/i.test(f.type)){img=await pdf.embedPng(bytes);}
        else{img=await pdf.embedJpg(bytes);}
        var landscape=orient==='l'||(orient==='auto'&&img.width>img.height);
        var pw=landscape?base[1]:base[0], ph=landscape?base[0]:base[1];
        var page=pdf.addPage([pw,ph]);
        var availW=pw-margin*2, availH=ph-margin*2;
        var scale=mode==='fill'?Math.max(availW/img.width,availH/img.height)
                               :Math.min(availW/img.width,availH/img.height);
        if(mode==='fill'){scale=Math.max(scale,0);}
        var w=img.width*scale,h=img.height*scale;
        page.drawImage(img,{x:(pw-w)/2,y:(ph-h)/2,width:w,height:h});
      }
      var out=await pdf.save();
      var blob=new Blob([out],{type:'application/pdf'});
      var url=URL.createObjectURL(blob);
      dl.innerHTML='<a class="btn btn-primary" href="'+url+'" download="images.pdf">Download PDF ('+
        files.length+' pages, '+size(blob.size)+')</a>';
      status.textContent='Done — '+files.length+' pages, '+size(blob.size)+'.';
      status.className='status ok show';
    }catch(err){
      status.textContent='Could not build the PDF: '+err.message;
      status.className='status bad show';
    }
    runBtn.disabled=false;
  });
  render();
})();
</script>
