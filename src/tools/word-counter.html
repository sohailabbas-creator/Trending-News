<div class="panel">
  <label for="wc-text">Your text</label>
  <textarea id="wc-text" rows="8" placeholder="Paste or type your text here…"></textarea>
  <div class="stat-grid">
    <div class="stat"><b id="wc-words">0</b><span>Words</span></div>
    <div class="stat"><b id="wc-chars">0</b><span>Characters</span></div>
    <div class="stat"><b id="wc-chars-ns">0</b><span>No spaces</span></div>
    <div class="stat"><b id="wc-sentences">0</b><span>Sentences</span></div>
    <div class="stat"><b id="wc-paras">0</b><span>Paragraphs</span></div>
    <div class="stat"><b id="wc-read">0 min</b><span>Reading time</span></div>
  </div>
  <div class="btns">
    <button class="btn btn-primary" id="wc-copy">Copy stats</button>
    <button class="btn" id="wc-clear">Clear</button>
  </div>
  <p class="status" id="wc-status" role="status"></p>
</div>

<div class="row">
  <div class="panel">
    <h2 class="panel-h">Most repeated words</h2>
    <div id="wc-density" class="plain-list muted">Type something to see keyword density.</div>
  </div>
  <div class="panel">
    <h2 class="panel-h">Details</h2>
    <div class="stat-grid" style="grid-template-columns:1fr 1fr">
      <div class="stat"><b id="wc-lines">0</b><span>Lines</span></div>
      <div class="stat"><b id="wc-unique">0</b><span>Unique words</span></div>
      <div class="stat"><b id="wc-avg">0</b><span>Avg word length</span></div>
      <div class="stat"><b id="wc-speak">0</b><span>Speaking (min)</span></div>
    </div>
  </div>
</div>

<script>
(function(){
  var text=document.getElementById('wc-text'),status=document.getElementById('wc-status');
  var STOP='the a an and or but if then than that this these those of to in on at for with as by from is are was were be been being it its i you he she they we not no so do does did have has had will would can could should my your our their there here about into over under'.split(' ');
  function time(mins){if(mins<1)return Math.max(1,Math.round(mins*60))+' sec';return Math.round(mins)+' min';}
  function update(){
    var t=text.value,w=t.trim()?t.trim().split(/\s+/):[];
    var sentences=t.split(/[.!?]+(?:\s|$)/).filter(function(s){return s.trim().length;});
    var paras=t.split(/\n\s*\n/).filter(function(p){return p.trim().length;});
    document.getElementById('wc-words').textContent=w.length.toLocaleString();
    document.getElementById('wc-chars').textContent=t.length.toLocaleString();
    document.getElementById('wc-chars-ns').textContent=t.replace(/\s/g,'').length.toLocaleString();
    document.getElementById('wc-sentences').textContent=sentences.length.toLocaleString();
    document.getElementById('wc-paras').textContent=paras.length.toLocaleString();
    document.getElementById('wc-read').textContent=time(w.length/238);
    document.getElementById('wc-speak').textContent=(w.length/130).toFixed(1);
    document.getElementById('wc-lines').textContent=(t?t.split('\n').length:0).toLocaleString();

    var low=w.map(function(x){return x.toLowerCase().replace(/[^a-z0-9'-]/g,'');}).filter(Boolean);
    var uniq={},counts={},total=0;
    low.forEach(function(x){
      uniq[x]=1;total+=x.length;
      var base=x.replace(/s$/,'');
      if(x.length<3||STOP.indexOf(base)>-1)return;
      counts[base]=(counts[base]||0)+1;
    });
    document.getElementById('wc-unique').textContent=Object.keys(uniq).length.toLocaleString();
    document.getElementById('wc-avg').textContent=low.length?(total/low.length).toFixed(1):'0';
    var top=Object.keys(counts).map(function(k){return [k,counts[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,8);
    document.getElementById('wc-density').innerHTML=top.length
      ? top.map(function(r){
          var pct=(r[1]/Math.max(1,w.length)*100).toFixed(1);
          return '<div class="kv"><span>'+r[0]+'</span><span class="muted">'+r[1]+'× · '+pct+'%</span></div>';}).join('')
      : 'Type something to see keyword density.';
  }
  text.addEventListener('input',update);
  document.getElementById('wc-clear').addEventListener('click',function(){text.value='';update();text.focus();});
  document.getElementById('wc-copy').addEventListener('click',function(){
    var t='Words '+document.getElementById('wc-words').textContent+' | Characters '+document.getElementById('wc-chars').textContent+
          ' | Without spaces '+document.getElementById('wc-chars-ns').textContent+' | Reading '+document.getElementById('wc-read').textContent;
    navigator.clipboard.writeText(t).then(function(){
      status.textContent='Stats copied.';status.className='status ok show';
      setTimeout(function(){status.className='status';},1500);});
  });
  update();
})();
</script>
