<div class="panel">
  <div class="row">
    <div class="field"><label for="dd-from">Start date</label><input type="date" id="dd-from"></div>
    <div class="field"><label for="dd-to">End date</label><input type="date" id="dd-to"></div>
  </div>
  <div class="row">
    <div class="field">
      <span class="label">Counting</span>
      <select id="dd-mode">
        <option value="exclusive" selected>Exclude the start date (notice periods)</option>
        <option value="inclusive">Include both start and end dates</option>
      </select>
    </div>
    <div class="field">
      <span class="label">Day type</span>
      <select id="dd-days">
        <option value="all" selected>All calendar days</option>
        <option value="weekday">Weekdays only (Mon–Fri)</option>
      </select>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat"><b id="dd-days-out">—</b><span>Days</span></div>
    <div class="stat"><b id="dd-weeks">—</b><span>Weeks</span></div>
    <div class="stat"><b id="dd-months">—</b><span>Months + days</span></div>
    <div class="stat"><b id="dd-hours">—</b><span>Hours</span></div>
  </div>
  <div class="out out-lg" id="dd-summary" aria-live="polite"></div>
  <p class="hint" id="dd-end"></p>
  <div class="btns">
    <button class="btn btn-primary" id="dd-copy">Copy result</button>
    <button class="btn" id="dd-swap">Swap dates</button>
  </div>
  <p class="status" id="dd-status" role="status"></p>
</div>

<script>
(function(){
  var fromEl=document.getElementById('dd-from'),toEl=document.getElementById('dd-to'),
      status=document.getElementById('dd-status');
  function iso(d){return d.toISOString().slice(0,10);}
  var today=new Date();
  toEl.value=iso(today);
  fromEl.value=iso(new Date(today.getFullYear(),today.getMonth(),today.getDate()-30));

  function countWeekdays(a,b){
    var n=0,d=new Date(a);
    while(d<b){var w=d.getDay();if(w!==0&&w!==6)n++;d.setDate(d.getDate()+1);}
    return n;
  }
  function calc(){
    if(!fromEl.value||!toEl.value){return;}
    var a=new Date(fromEl.value+'T00:00:00'),b=new Date(toEl.value+'T00:00:00');
    var sign=1;if(b<a){var t=a;a=b;b=t;sign=-1;}
    var mode=document.getElementById('dd-mode').value,
        dayType=document.getElementById('dd-days').value;
    var msDay=86400000;
    var days;
    if(dayType==='weekday'){
      days=countWeekdays(a,new Date(b.getTime()+(mode==='inclusive'?msDay:0)));
    } else {
      days=Math.round((b-a)/msDay)+(mode==='inclusive'?1:0);
    }
    days*=sign;

    // calendar breakdown
    var y=b.getFullYear()-a.getFullYear(), mo=b.getMonth()-a.getMonth(), d=b.getDate()-a.getDate();
    if(d<0){mo--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate();}
    if(mo<0){y--;mo+=12;}

    document.getElementById('dd-days-out').textContent=Math.abs(days).toLocaleString();
    document.getElementById('dd-weeks').textContent=(Math.abs(days)/7).toFixed(1);
    document.getElementById('dd-months').textContent=y+'y '+mo+'m '+d+'d';
    document.getElementById('dd-hours').textContent=(Math.abs(days)*24).toLocaleString();
    document.getElementById('dd-summary').innerHTML='<b>'+Math.abs(days).toLocaleString()+' '+
      (dayType==='weekday'?'weekdays':'days')+'</b> between '+fromEl.value+' and '+toEl.value+
      ' ('+(mode==='inclusive'?'both dates included':'start date excluded')+').';
    document.getElementById('dd-end').textContent=
      dayType==='weekday'?'Public holidays are not deducted — check your national calendar if the deadline is critical.':'';
    status.className='status';
  }
  ['dd-from','dd-to','dd-mode','dd-days'].forEach(function(id){
    document.getElementById(id).addEventListener('change',calc);
    document.getElementById(id).addEventListener('input',calc);
  });
  document.getElementById('dd-swap').addEventListener('click',function(){
    var t=fromEl.value;fromEl.value=toEl.value;toEl.value=t;calc();});
  document.getElementById('dd-copy').addEventListener('click',function(){
    navigator.clipboard.writeText(document.getElementById('dd-summary').textContent).then(function(){
      status.textContent='Copied.';status.className='status ok show';
      setTimeout(function(){status.className='status';},1500);});
  });
  calc();
})();
</script>
