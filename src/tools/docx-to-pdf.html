<div class="panel">
  <label class="drop" for="dw-file" id="dw-drop">
    <strong>Choose a .docx file</strong> or drag it here<br>
    <span class="muted small">Modern Word format only (.docx) · converted locally</span>
  </label>
  <input type="file" id="dw-file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>

  <div class="btns">
    <button class="btn btn-primary" id="dw-run" disabled>Convert to PDF</button>
    <button class="btn" id="dw-clear" disabled>Clear</button>
  </div>
  <p class="status" id="dw-status" role="status">No file selected.</p>
  <div id="dw-download"></div>
  <p class="hint">Text-focused conversion: headings and paragraphs are kept, images, tables, columns and
    custom fonts are not. For a pixel-exact copy of a designed document, use Word or LibreOffice → Save as PDF.</p>
</div>

<div class="panel" id="dw-preview-wrap" hidden>
  <h2 class="panel-h">Extracted text preview</h2>
  <div class="out" id="dw-preview" style="max-height:260px;white-space:pre-wrap"></div>
</div>

<script src="{{P}}assets/vendor/fflate.js"></script>
<script src="{{P}}assets/vendor/pdf-lib.min.js"></script>
<script>
(function(){
  var input=document.getElementById('dw-file'),status=document.getElementById('dw-status'),
      runBtn=document.getElementById('dw-run'),clearBtn=document.getElementById('dw-clear'),
      dl=document.getElementById('dw-download'),current=null;

  function u8ToStr(u8){return new TextDecoder('utf-8').decode(u8);}

  function extractParagraphs(xmlText){
    var doc=new DOMParser().parseFromString(xmlText,'application/xml');
    var paras=[].slice.call(doc.getElementsByTagName('w:p'));
    return paras.map(function(p){
      var texts=[].slice.call(p.getElementsByTagName('w:t')).map(function(t){return t.textContent;}).join('');
      var styleEl=p.getElementsByTagName('w:pStyle')[0];
      var style=styleEl?styleEl.getAttribute('w:val'):'';
      var heading=/Heading([1-6])/i.exec(style);
      return {text:texts,heading:heading?parseInt(heading[1],10):0};
    }).filter(function(p){return p.text.trim().length>0;});
  }

  // PDF standard fonts are WinAnsi — map the characters people actually use
  function sanitize(s){
    return s.replace(/[\u2018\u2019\u201A\u201B]/g,"'").replace(/[\u201C\u201D\u201E]/g,'"')
      .replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/\u00A0/g,' ')
      .replace(/[\u2022\u25CF]/g,'-').replace(/[^\x09\x0A\x0D\x20-\x7E\u00A1-\u00FF]/g,'');
  }

  input.addEventListener('change',function(e){
    current=e.target.files[0]||null;
    runBtn.disabled=!current;clearBtn.disabled=!current;
    if(current){status.textContent=current.name+' · '+(current.size/1024).toFixed(0)+' KB · ready to convert.';
      status.className='status';}
    input.value='';
  });
  ['dragenter','dragover'].forEach(function(ev){
    document.getElementById('dw-drop').addEventListener(ev,function(e){e.preventDefault();this.classList.add('over');});});
  ['dragleave','drop'].forEach(function(ev){
    document.getElementById('dw-drop').addEventListener(ev,function(e){e.preventDefault();this.classList.remove('over');});});
  document.getElementById('dw-drop').addEventListener('drop',function(e){
    if(!e.dataTransfer||!e.dataTransfer.files.length)return;
    current=e.dataTransfer.files[0];runBtn.disabled=false;clearBtn.disabled=false;
    status.textContent=current.name+' · ready to convert.';status.className='status';});
  clearBtn.addEventListener('click',function(){current=null;dl.innerHTML='';
    document.getElementById('dw-preview-wrap').hidden=true;
    runBtn.disabled=clearBtn.disabled=true;status.textContent='No file selected.';status.className='status';});

  runBtn.addEventListener('click',async function(){
    if(!current)return;
    if(!/\.docx$/i.test(current.name)){
      status.textContent='Please choose a .docx file. The older .doc format is not supported — open it in Word or LibreOffice and save as .docx first.';
      status.className='status bad show';return;
    }
    runBtn.disabled=true;status.textContent='Reading the document…';status.className='status show';
    try{
      var buf=await current.arrayBuffer();
      var zip=fflate.unzipSync(new Uint8Array(buf));
      var docXml=zip['word/document.xml'];
      if(!docXml){throw new Error('word/document.xml not found — is this really a .docx file?');}
      var paras=extractParagraphs(u8ToStr(docXml));
      if(!paras.length){throw new Error('No readable text found in this document.');}

      document.getElementById('dw-preview').textContent=paras.map(function(p){return p.text;}).join('\n');
      document.getElementById('dw-preview-wrap').hidden=false;

      var pdf=await PDFLib.PDFDocument.create();
      var font=await pdf.embedFont(PDFLib.StandardFonts.Helvetica);
      var bold=await pdf.embedFont(PDFLib.StandardFonts.HelveticaBold);
      var pageW=595.28,pageH=841.89,margin=56,lineH=15;
      var page=pdf.addPage([pageW,pageH]);
      var y=pageH-margin;
      var maxW=pageW-margin*2;

      function wrap(text,size,useBold){
        var f=useBold?bold:font,lines=[],words=sanitize(text).split(/\s+/),line='';
        for(var i=0;i<words.length;i++){
          var test=line?line+' '+words[i]:words[i];
          if(f.widthOfTextAtSize(test,size)>maxW&&line){lines.push(line);line=words[i];}
          else{line=test;}
        }
        if(line)lines.push(line);
        return lines;
      }
      function newPage(){
        page=pdf.addPage([pageW,pageH]);y=pageH-margin;
      }

      for(var i=0;i<paras.length;i++){
        var p=paras[i];
        var size=p.heading===1?16:(p.heading===2?14:(p.heading===3?12.5:10.5));
        var useBold=p.heading>0;
        var lines=wrap(p.text,size,useBold);
        for(var j=0;j<lines.length;j++){
          if(y<margin+lineH){newPage();}
          page.drawText(lines[j],{x:margin,y:y,size:size,font:useBold?bold:font});
          y-=size*1.45;
        }
        y-=p.heading?8:5;
        if(y<margin+lineH){newPage();}
      }

      var pages=pdf.getPages();
      for(var k=0;k<pages.length;k++){
        pages[k].drawText(String(k+1)+' / '+pages.length,
          {x:pageW/2-14,y:24,size:8,font:font,opacity:0.55});
      }

      var out=await pdf.save();
      var blob=new Blob([out],{type:'application/pdf'});
      var url=URL.createObjectURL(blob);
      dl.innerHTML='<a class="btn btn-primary" href="'+url+'" download="'+current.name.replace(/\.docx$/i,'')+'.pdf">Download PDF ('+
        pages.length+' page'+(pages.length===1?'':'s')+', '+(blob.size/1024).toFixed(0)+' KB)</a>';
      status.textContent='Converted '+paras.length+' paragraphs into '+pages.length+' page(s).';
      status.className='status ok show';
    }catch(err){
      status.textContent='Conversion failed: '+err.message;
      status.className='status bad show';
    }
    runBtn.disabled=false;
  });
})();
</script>
