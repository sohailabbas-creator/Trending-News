<div class="panel">
  <div class="row">
    <div class="field"><label for="tip-bill">Bill amount</label><input type="number" id="tip-bill" value="85" min="0" step="0.01" inputmode="decimal"></div>
    <div class="field"><label for="tip-pct">Tip (%)</label><input type="number" id="tip-pct" value="18" min="0" max="100" step="0.5" inputmode="decimal"></div>
  </div>
  <div class="chips" id="tip-presets">
    <button class="chip" data-p="10">10%</button>
    <button class="chip" data-p="12.5">12.5%</button>
    <button class="chip" data-p="15">15%</button>
    <button class="chip is-on" data-p="18">18%</button>
    <button class="chip" data-p="20">20%</button>
    <button class="chip" data-p="25">25%</button>
  </div>
  <div class="row" style="margin-top:16px">
    <div class="field"><label for="tip-tax">Tax already in the bill (%)</label><input type="number" id="tip-tax" value="0" min="0" max="50" step="0.1" inputmode="decimal"></div>
    <div class="field"><label for="tip-people">Split between (people)</label><input type="number" id="tip-people" value="2" min="1" max="50" step="1" inputmode="numeric"></div>
  </div>
  <label class="check"><input type="checkbox" id="tip-pretax" checked> Tip on the pre-tax amount (recommended)</label>

  <div class="stat-grid">
    <div class="stat"><b id="tip-amount">—</b><span>Tip</span></div>
    <div class="stat"><b id="tip-total">—</b><span>Total</span></div>
    <div class="stat"><b id="tip-each">—</b><span>Each pays</span></div>
    <div class="stat"><b id="tip-round">—</b><span>Each, rounded up</span></div>
  </div>
  <div class="out" id="tip-summary" aria-live="polite"></div>
  <p class="hint">If the bill already includes a service charge, do not add a second tip on top of it.</p>
</div>

<script>
(function(){
  var m=function(n){return n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});};
  function v(id){var x=parseFloat(document.getElementById(id).value);return isNaN(x)?0:x;}
  function calc(){
    var bill=v('tip-bill'),pct=v('tip-pct'),tax=v('tip-tax'),people=Math.max(1,Math.round(v('tip-people')));
    var pretax=document.getElementById('tip-pretax').checked;
    var base=pretax&&tax>0?bill/(1+tax/100):bill;
    var tip=base*pct/100,total=bill+tip,each=total/people;
    document.getElementById('tip-amount').textContent=m(tip);
    document.getElementById('tip-total').textContent=m(total);
    document.getElementById('tip-each').textContent=m(each);
    document.getElementById('tip-round').textContent=m(Math.ceil(each));
    document.getElementById('tip-summary').textContent=
      'Bill '+m(bill)+(tax?(' (includes '+tax+'% tax, base '+m(base)+')'):'')+
      ' + tip '+pct+'% = '+m(tip)+' → total '+m(total)+
      (people>1?(' split '+people+' ways = '+m(each)+' each'):'')+'.';
  }
  document.getElementById('tip-presets').addEventListener('click',function(e){
    var b=e.target.closest('.chip');if(!b)return;
    document.getElementById('tip-pct').value=b.dataset.p;
    [].forEach.call(this.querySelectorAll('.chip'),function(c){c.classList.toggle('is-on',c===b);});
    calc();
  });
  ['tip-bill','tip-pct','tip-tax','tip-people'].forEach(function(id){
    document.getElementById(id).addEventListener('input',calc);});
  document.getElementById('tip-pretax').addEventListener('change',calc);
  calc();
})();
</script>
