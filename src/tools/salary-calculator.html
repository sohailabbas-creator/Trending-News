<div class="panel">
  <div class="seg" role="radiogroup" aria-label="Conversion direction">
    <button class="seg-btn is-on" data-d="to-hourly" role="radio" aria-checked="true">Salary → hourly</button>
    <button class="seg-btn" data-d="to-salary" role="radio" aria-checked="false">Hourly → salary</button>
  </div>

  <div class="row">
    <div class="field">
      <label for="sal-amount" id="sal-label">Annual gross salary</label>
      <input type="number" id="sal-amount" value="60000" min="0" step="100" inputmode="decimal">
    </div>
    <div class="field">
      <label for="sal-period">Paid every</label>
      <select id="sal-period" aria-describedby="sal-note">
        <option value="year" selected>Year</option>
        <option value="month">Month</option>
        <option value="week">Week</option>
        <option value="hour" id="sal-hour-opt" hidden>Hour</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="field"><label for="sal-hours">Paid hours per week</label><input type="number" id="sal-hours" value="40" min="1" max="80" step="0.5" inputmode="decimal"></div>
    <div class="field"><label for="sal-weeks">Paid weeks per year</label><input type="number" id="sal-weeks" value="52" min="1" max="52" step="1" inputmode="numeric"></div>
  </div>

  <div class="stat-grid">
    <div class="stat"><b id="sal-hourly">—</b><span>Per hour</span></div>
    <div class="stat"><b id="sal-weekly">—</b><span>Per week</span></div>
    <div class="stat"><b id="sal-monthly">—</b><span>Per month</span></div>
    <div class="stat"><b id="sal-annual">—</b><span>Per year</span></div>
  </div>
  <div class="out" id="sal-maths" aria-live="polite"></div>
  <p class="hint" id="sal-note"></p>
  <div class="btns"><button class="btn btn-primary" id="sal-copy">Copy figures</button></div>
  <p class="status" id="sal-status" role="status"></p>
</div>

<div class="panel panel-soft">
  <h2 class="panel-h">Common conversions at 40 hours × 52 weeks</h2>
  <div class="table-wrap"><table class="data">
    <thead><tr><th scope="col">Annual</th><th scope="col">Monthly</th><th scope="col">Weekly</th><th scope="col">Hourly</th></tr></thead>
    <tbody id="sal-table"></tbody>
  </table></div>
</div>

<script>
(function(){
  var dir='to-hourly',status=document.getElementById('sal-status');
  var money=function(n){return n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});};
  function calc(){
    var amt=parseFloat(document.getElementById('sal-amount').value)||0,
        hs=parseFloat(document.getElementById('sal-hours').value)||40,
        wk=parseFloat(document.getElementById('sal-weeks').value)||52;
    var perYear=hs*wk;
    var annual;
    if(dir==='to-hourly'){
      var per=document.getElementById('sal-period').value;
      annual=per==='year'?amt:per==='month'?amt*12:per==='week'?amt*wk:amt*perYear;
    } else {
      annual=amt*perYear;
    }
    var hourly=annual/perYear, weekly=annual/wk, monthly=annual/12;
    document.getElementById('sal-hourly').textContent=money(hourly);
    document.getElementById('sal-weekly').textContent=money(weekly);
    document.getElementById('sal-monthly').textContent=money(monthly);
    document.getElementById('sal-annual').textContent=money(annual);
    document.getElementById('sal-maths').textContent=
      money(annual)+' per year ÷ ('+hs+' hours × '+wk+' weeks = '+(perYear%1?perYear.toFixed(2):perYear)+' paid hours) = '+money(hourly)+' per hour';
    document.getElementById('sal-note').textContent=
      'Gross pay only. Income tax, national insurance, social security and pension contributions are not deducted — those depend on where you live and your circumstances.';
  }
  document.querySelectorAll('.seg-btn').forEach(function(b){
    b.addEventListener('click',function(){
      dir=b.dataset.d;
      document.querySelectorAll('.seg-btn').forEach(function(x){
        x.classList.toggle('is-on',x===b);x.setAttribute('aria-checked',String(x===b));});
      document.getElementById('sal-label').textContent=dir==='to-hourly'?'Salary amount':'Hourly rate';
      document.getElementById('sal-period').parentElement.hidden=(dir==='to-salary');
      calc();
    });
  });
  ['sal-amount','sal-hours','sal-weeks'].forEach(function(id){
    document.getElementById(id).addEventListener('input',calc);
  });
  document.getElementById('sal-period').addEventListener('change',calc);
  document.getElementById('sal-copy').addEventListener('click',function(){
    var t=['annual '+document.getElementById('sal-annual').textContent,'monthly '+document.getElementById('sal-monthly').textContent,
           'weekly '+document.getElementById('sal-weekly').textContent,'hourly '+document.getElementById('sal-hourly').textContent].join(' | ');
    navigator.clipboard.writeText(t).then(function(){
      status.textContent='Copied.';status.className='status ok show';
      setTimeout(function(){status.className='status';},1500);});
  });
  var rows=[25000,35000,45000,60000,80000,100000];
  document.getElementById('sal-table').innerHTML=rows.map(function(a){
    var h=a/2080;
    return '<tr><td class="mono">'+a.toLocaleString()+'</td><td class="mono">'+(a/12).toFixed(2)+
           '</td><td class="mono">'+(a/52).toFixed(2)+'</td><td class="mono">'+h.toFixed(2)+'</td></tr>';
  }).join('');
  calc();
})();
</script>
