<div class="panel">
  <div class="seg" role="radiogroup" aria-label="Pay basis">
    <button class="seg-btn is-on" data-b="hourly" role="radio" aria-checked="true">Hourly rate</button>
    <button class="seg-btn" data-b="salary" role="radio" aria-checked="false">Annual salary</button>
  </div>

  <div class="row">
    <div class="field"><label for="ot-rate" id="ot-rate-label">Hourly rate</label><input type="number" id="ot-rate" value="20" min="0" step="0.01" inputmode="decimal"></div>
    <div class="field"><label for="ot-regular">Regular hours in the period</label><input type="number" id="ot-regular" value="40" min="0" max="168" step="0.5" inputmode="decimal"></div>
  </div>
  <div class="row">
    <div class="field"><label for="ot-h1">Overtime hours — band 1</label><input type="number" id="ot-h1" value="5" min="0" step="0.5" inputmode="decimal"></div>
    <div class="field">
      <label for="ot-m1">Band 1 multiplier</label>
      <select id="ot-m1"><option value="1.25">1.25×</option><option value="1.5" selected>1.5× (time and a half)</option>
      <option value="1.75">1.75×</option><option value="2">2× (double time)</option><option value="custom">Custom…</option></select>
      <input type="number" id="ot-m1-custom" value="1.5" min="1" step="0.05" hidden aria-label="Custom band 1 multiplier">
    </div>
  </div>
  <div class="row">
    <div class="field"><label for="ot-h2">Overtime hours — band 2 <span class="muted">optional</span></label><input type="number" id="ot-h2" value="0" min="0" step="0.5" inputmode="decimal"></div>
    <div class="field">
      <label for="ot-m2">Band 2 multiplier</label>
      <select id="ot-m2"><option value="1.5">1.5×</option><option value="2" selected>2× (double time)</option>
      <option value="2.5">2.5×</option><option value="3">3×</option></select>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat"><b id="ot-regular-pay">—</b><span>Regular pay</span></div>
    <div class="stat"><b id="ot-ot-pay">—</b><span>Overtime pay</span></div>
    <div class="stat"><b id="ot-total">—</b><span>Total gross</span></div>
    <div class="stat"><b id="ot-eff">—</b><span>Effective hourly</span></div>
  </div>
  <div class="out" id="ot-summary" aria-live="polite"></div>
  <p class="hint" id="ot-note"></p>
  <p class="status" id="ot-status" role="status"></p>
</div>

<script>
(function(){
  var basis='hourly',status=document.getElementById('ot-status');
  var m=function(n){return n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});};
  function v(id){var x=parseFloat(document.getElementById(id).value);return isNaN(x)?0:x;}
  function calc(){
    var rate=v('ot-rate');
    if(basis==='salary'){rate=rate/(52*40);}
    var regH=v('ot-regular'),h1=v('ot-h1'),h2=v('ot-h2');
    var m1=document.getElementById('ot-m1').value==='custom'?v('ot-m1-custom'):parseFloat(document.getElementById('ot-m1').value);
    var m2=parseFloat(document.getElementById('ot-m2').value);
    var regPay=regH*rate, otPay=h1*rate*m1+h2*rate*m2, total=regPay+otPay;
    var hours=regH+h1+h2;
    document.getElementById('ot-regular-pay').textContent=m(regPay);
    document.getElementById('ot-ot-pay').textContent=m(otPay);
    document.getElementById('ot-total').textContent=m(total);
    document.getElementById('ot-eff').textContent=m(hours?total/hours:0);
    document.getElementById('ot-summary').innerHTML=
      'Base rate '+m(rate)+'/hour · regular '+regH+'h = '+m(regPay)+
      ' · band 1 '+h1+'h × '+m1+'× = '+m(h1*rate*m1)+
      (h2?(' · band 2 '+h2+'h × '+m2+'× = '+m(h2*rate*m2)):'')+
      ' · <b>total '+m(total)+'</b> for '+hours+' paid hours.';
    document.getElementById('ot-note').textContent=
      basis==='salary'?'Salary converted using 40 hours × 52 weeks = 2,080 hours per year. If your contract uses a different divisor, switch to the hourly rate mode.':'';
  }
  document.querySelectorAll('.seg-btn').forEach(function(b){
    b.addEventListener('click',function(){
      basis=b.dataset.b;
      document.querySelectorAll('.seg-btn').forEach(function(x){
        x.classList.toggle('is-on',x===b);x.setAttribute('aria-checked',String(x===b));});
      document.getElementById('ot-rate-label').textContent=basis==='hourly'?'Hourly rate':'Annual gross salary';
      calc();
    });
  });
  document.getElementById('ot-m1').addEventListener('change',function(){
    document.getElementById('ot-m1-custom').hidden=this.value!=='custom';calc();});
  ['ot-rate','ot-regular','ot-h1','ot-h2','ot-m1-custom','ot-m2'].forEach(function(id){
    document.getElementById(id).addEventListener('input',calc);
    document.getElementById(id).addEventListener('change',calc);
  });
  calc();
})();
</script>
