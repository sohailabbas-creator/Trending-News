<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


<meta name="description" content="Use our free online calculator for quick and accurate calculations. Easy to use, fast, and mobile-friendly calculator for everyday math.">

<meta name="keywords" content="online calculator, free calculator, calculator online, math calculator, simple calculator, online math calculator">

<meta name="robots" content="index, follow">

<meta name="author" content="Sohail Abbas">

<link rel="canonical" href="https://sohailabbas.site/">
    <link rel="stylesheet" href="style.css" />
    <title>Calculator - By Code Sohail</title>
  </head>
  <body>

    <div class="container">
        <h1 class="smart"> Smart Calculator</h1>
      <div class="calculator">
        <input type="text" id="inputBox" placeholder="0" />
        <div>
          <button class="button operator">AC</button>
          <button class="button operator">DEL</button>
          <button class="button operator">%</button>
          <button class="button operator">/</button>
        </div>
        <div>
          <button class="button">7</button>
          <button class="button">8</button>
          <button class="button">9</button>
          <button class="button operator">*</button>
        </div>
        <div>
          <button class="button">4</button>
          <button class="button">5</button>
          <button class="button">6</button>
          <button class="button operator">-</button>
        </div>
        <div>
          <button class="button">1</button>
          <button class="button">2</button>
          <button class="button">3</button>
          <button class="button operator">+</button>
        </div>

        <div>
          <button class="button">00</button>
          <button class="button">0</button>
          <button class="button">.</button>
          <button class="button equalBtn">=</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
